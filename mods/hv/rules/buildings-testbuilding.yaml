TESTBUILDING:
	Inherits: ^BaseBuilding
	Inherits@Shape: ^2x2Shape
	Inherits@Flame: ^BuildingFlame2
	Inherits@Disable: ^DisableOnLowPowerOrPowerDown
	Encyclopedia:
		Description: actor-testbuilding.encyclopedia
		Order: 50
		Scale: 2
		Category: Buildings
	RenderSprites:
		Image: testbuilding
	Selectable:
		Bounds: 2048, 2448
	Buildable: 		
		# I commented out Prerequisites below so that way either faction can build it
		#Prerequisites: ~structures.sc
		Queue: Building
		BuildPaletteOrder: 30
		Description: actor-testbuilding.description
		RequiresCondition: !powerdown
	ProvidesPrerequisite@Faction:
		Prerequisite: module.sc
		RequiresCondition: !powerdown
	ProvidesPrerequisite@Generic:
		Prerequisite: module
		RequiresCondition: !powerdown
	Valued:
		Cost: 5
	Tooltip:
		Name: actor-testbuilding.name
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 60000
	Armor:
		Type: Steel
	RevealsShroud:
		Range: 5c0
		MinRange: 2c0
		RevealGeneratedShroud: False
	RevealsShroud@Hacked:
		Range: 2c0
	RallyPoint:
		CirclesSequence:
		IsPlayerPalette: true
		Palette: green
		LineWidth: 2
	ExitsDebugOverlay:
	Exit@South1:
		SpawnOffset: -150,800,0
		ExitCell: 1,2
		ProductionTypes: Pod
		Priority: 10
		RequiresCondition: !being-captured && !build-incomplete
	Exit@South2:
		SpawnOffset: 150,800,0
		ExitCell: 0,2
		ProductionTypes: Pod
		Priority: 10
		RequiresCondition: !being-captured && !build-incomplete
	Exit@North1:
		SpawnOffset: -150,-800,0
		ExitCell: 1,-1
		ProductionTypes: Pod
		RequiresCondition: !being-captured && !build-incomplete
	Exit@North2:
		SpawnOffset: 150,-800,0
		ExitCell: 0,-1
		ProductionTypes: Pod
		RequiresCondition: !being-captured && !build-incomplete
	Production:
		Produces: Pod
		RequiresCondition: !powerdown
	GrantExternalConditionToProduced:
		Condition: produced
	WithProductionDoorAnimation:
		ExitCells: 0,2, 1,2
		ReplayBackwards: true
		RequiresCondition: !build-incomplete && !burning
	PrimaryBuilding:
		PrimaryCondition: primary
		SelectionNotification: PrimaryBuildingSelected
	ProductionBar:
		ProductionType: Pod
	Power:
		Amount: -2
	ProvidesPrerequisite@BuildingName:
	Targetable:
		TargetTypes: Ground, Structure
	WithTextDecoration@PRIMARY:
		RequiresCondition: primary
		Position: Top
		Margin: 0, 5
		RequiresSelection: true
		Text: PRIMARY
		Font: TinyPixel
	WithProductionOverlay:
		RequiresCondition: !build-incomplete && !burning
		Sequence: production-inprogress
	RepairsUnits:
		HpPerStep: 1000
		Interval: 7
		PlayerExperience: 15
		StartRepairingNotification: Repairing
		StartRepairingTextNotification: notifications-repairing
		FinishRepairingNotification: UnitRepaired
		FinishRepairingTextNotification: notification-unit-repaired
		RequiresCondition: !powerdown